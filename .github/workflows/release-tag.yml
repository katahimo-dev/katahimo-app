# リリースのタグ vX.Y.Z を付ける(手で実行する。doc/07_インフラ・運用.md 4.2)。
# タグの push で Cloud Build のトリガー katahimo-release が(承認の後に)本番に canary で出す。手元に git の書き込みの権限が
# 無い環境(Claude のクラウドのセッション等)からも `gh workflow run release-tag.yml -f version=X.Y.Z` で付けられる。
#
# 付ける前に確かめること(どれか1つでも満たさなければタグを付けずに失敗する):
#   - version が X.Y.Z の形で、タグ vX.Y.Z がまだ無い
#   - 付けるコミットが main に含まれている(ブランチの途中のコミットを本番に出さない)
#   - そのコミットの CHANGELOG.md に `## [Ver. X.Y.Z]` があり、ルートと全ワークスペースの package.json の version が X.Y.Z
#     (CHANGELOG の「未リリース」を版にする PR をマージしてから付ける)
#   - そのコミットで CI の「lint・型検査・テスト・ビルド」が成功している(ドキュメントだけのコミットで CI が省かれていれば、
#     CI が成功した直近の祖先からの差分がドキュメントだけであること)
#
# 誰がタグを付けられるか(doc/07 4.1・9.2、doc/06 12章):
#   - タグ v* の作成・更新・削除は GitHub のルールセット release-tags で止め、例外(バイパス)はリリース用の GitHub App
#     (katahimo-release-bot)とリポジトリの管理者だけにする。GitHub Actions(GITHUB_TOKEN)は例外に入れない
#     (入れると、書き込みの権限がある人が別のブランチに置いたワークフローからでもタグを付けられる)。
#   - この App の秘密鍵は Environment「release」(ブランチは main だけ)のシークレットに置く。main 以外から実行した、または
#     書き換えたこのファイルの写しでは鍵を受け取れず、タグを push できない。下の「main から実行したか」は分かりやすく止めるための
#     もので、写しでは外せる。本当の歯止めは Environment のブランチの制限とルールセット。
name: release-tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 付ける版(X.Y.Z。タグは vX.Y.Z)
        required: true
        type: string
      ref:
        description: タグを付けるコミット(SHA か main。既定は main の先頭)
        required: false
        default: main
        type: string

# 同時に2つ付けない(同じ版を二重に付けようとしたときに後の方が確かめ直して止まるように、止めずに待たせる)
concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: リリースのタグを付ける
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 秘密鍵 RELEASE_APP_PRIVATE_KEY はこの Environment のシークレット(Deployment branches は main だけ。doc/07 9.2)
    environment: release
    permissions:
      # 読むだけ(タグの push はリリース用の GitHub App のトークンで行う)
      contents: read
      # CI の結果(check runs)を読む
      checks: read

    steps:
      - name: main から実行したか
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::main から実行してください(実行したのは $REF)"; exit 1; }

      # タグを push できるのはルールセットの例外に入れたこの App だけ(GITHUB_TOKEN では断られる)
      - name: リリース用の GitHub App のトークン
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          ref: main
          # タグの push に使う(リリース用の App のトークン)
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: 確かめる
        id: check
        env:
          # 入力は式に直接埋め込まず環境変数で渡す(スクリプトへの差し込みを防ぐ)
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          CI_CHECK: lint・型検査・テスト・ビルド
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version は X.Y.Z の形にしてください: $VERSION"
          tag="v$VERSION"
          [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ] || fail "タグ $tag はもうあります"

          commit="$(git rev-parse --verify --quiet "$REF^{commit}")" || fail "コミットが見つかりません: $REF"
          git merge-base --is-ancestor "$commit" origin/main || fail "$commit は main に含まれていません"

          git show "$commit:CHANGELOG.md" | grep -Fq "## [Ver. $VERSION] " \
            || fail "CHANGELOG.md に「## [Ver. $VERSION] - 日付」がありません(「未リリース」を版にする PR を先にマージする)"
          # ルートと全ワークスペース(packages/*・tools/*)。画面の「Ver.」は packages/web の version
          mismatched=""
          while read -r file; do
            pkg="$(git show "$commit:$file" | jq -r .version)"
            [ "$pkg" = "$VERSION" ] || mismatched="$mismatched $file($pkg)"
          done < <(git ls-tree -r --name-only "$commit" | grep -E '^((packages|tools)/[^/]+/)?package\.json$')
          [ -z "$mismatched" ] || fail "version が $VERSION ではない package.json があります:$mismatched"

          # ドキュメントだけのコミットでは CI がこのジョブを省く(skipped)。そのときは1つ前(first parent)へさかのぼり、
          # CI が成功したコミットを探す。見つかったコミットから指定のコミットまでの差分がドキュメントだけなら、本番に出るコードは
          # テストを通ったものと同じなので、指定のコミットにタグを付ける
          tested="$commit"
          for _ in $(seq 1 30); do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tested/check-runs" \
              -X GET -f check_name="$CI_CHECK" -f filter=latest --jq '.check_runs[0].conclusion // "none"')"
            [ "$conclusion" = skipped ] || break
            tested="$(git rev-parse --verify --quiet "$tested^1")" || fail "CI が流れたコミットが見つかりません"
          done
          [ "$conclusion" = success ] \
            || fail "${tested:0:7} の「$CI_CHECK」が成功していません($conclusion。none は実行中か未実行。main の CI が終わってから実行する)"
          if [ "$tested" != "$commit" ]; then
            others="$(git -c core.quotePath=false diff --name-only --no-renames "$tested" "$commit" | grep -vE '(\.md$|^doc/)' || true)"
            [ -z "$others" ] || fail "${tested:0:7}(CI が成功)から ${commit:0:7} までにドキュメント以外の変更があります: $(echo $others)"
            echo "::notice::${commit:0:7} はドキュメントだけの変更のため、CI が成功した ${tested:0:7} のコードで確かめた"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: タグを付けて push する
        env:
          TAG: ${{ steps.check.outputs.tag }}
          COMMIT: ${{ steps.check.outputs.commit }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Ver. ${TAG#v}" "$COMMIT"
          git push origin "refs/tags/$TAG"
          {
            echo "### $TAG を付けました"
            echo
            echo "- コミット: \`${COMMIT:0:7}\`"
            echo "- Cloud Build のトリガー katahimo-release のビルドが承認待ちになります。承認する人がタグのコミットとマイグレーションの差分を見て承認すると、本番に canary で出ます(利用者はまだ前の版)。"
            echo "- 確かめてから cloudbuild.promote.yaml で切り替えます(doc/07_インフラ・運用.md 4.2)。"
          } >> "$GITHUB_STEP_SUMMARY"
