# CI: lint / 型検査 / マイグレーション(差分チェック含む)/ テスト / ビルド、と 実際のAPI・DBでの通し確認(e2e)。
# ドキュメント(*.md・doc/ の下)だけの変更では check・e2e を省き、資料のリンク・図の検査(docs)だけを流す(changes ジョブ)。
# 必要な設定(doc/07_インフラ・運用.md 9章):
#   Environment legacy-submodule の secret SUBMODULE_TOKEN … katahimo-dev/gas-childcare-visit-app だけを読める fine-grained PAT
#                             (Contents: Read-only・期限つき)。Environment のブランチは main だけに絞る。リポジトリの
#                             secret には置かない(PR のワークフローから読めてしまう)。
#                             GAS版との一致テスト(gasParity)は、このトークンを使う parity ジョブだけが main への push で流す。
#                             PR の check ジョブにはトークンを渡さず、gasParity はスキップされる(e2e ジョブはこのサブモジュールを使わない)。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同じ PR への新しい push で古い実行を止める。main への push は1コミットずつ結果を残すため止めない
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # services の PostgreSQL(スーパーユーザー)。infra/initdb の SQL を流すのに使う
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres
  # infra/initdb/*.sql が作るロール(.env.example と同じ)。DB の結合テスト(vitest の integration)もこれを使う
  DATABASE_URL: postgres://katahimo_app:katahimo_app@localhost:5432/katahimo_dev
  MIGRATION_DATABASE_URL: postgres://katahimo_migrator:katahimo_migrator@localhost:5432/katahimo_dev
  WORKER_DATABASE_URL: postgres://katahimo_worker:katahimo_worker@localhost:5432/katahimo_dev

jobs:
  # 変わったファイルがドキュメント(*.md・doc/ の下)だけなら、check・e2e を省いて docs だけを流す。
  # 条件で省いたジョブは必須のステータスチェックでは成功と同じ扱いになるため、ブランチ保護の「lint・型検査・テスト・ビルド」で
  # PR が止まらない。コード・設定・ワークフロー・サブモジュールが1つでも変われば全部流す(手で実行したときも全部)。
  changes:
    name: 変更の種類
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # ファイル名を比べるだけなので履歴はコミットと木だけを取る(ブロブは要らない)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          # 比べる相手が無い・読めない(手で実行・新しいブランチの最初の push 等)ときは全部流す
          # core.quotePath=false: 日本語のファイル名(doc/07_インフラ・運用.md 等)を "doc/\343…" と引用符・8進数にしない。
          # --no-renames: 名前の変更を「消したファイル + 足したファイル」で出す(コードを doc/ の下へ移したときに元のパスも見る)
          if [ -z "$range" ] || ! files="$(git -c core.quotePath=false diff --name-only --no-renames "$range" 2>/dev/null)"; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "比べる範囲が無いため全部流す"; exit 0
          fi
          echo "$files"
          if [ -n "$files" ] && ! grep -vE '(\.md$|^doc/)' <<< "$files" > /dev/null; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "ドキュメントだけの変更: check・e2e を省く"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: 資料のリンク・図
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # scripts/checkDocLinks.mjs は Node の標準モジュールだけを使う(依存のインストールは要らない)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: pnpm docs:check
        run: node scripts/checkDocLinks.mjs

  check:
    name: lint・型検査・テスト・ビルド
    needs: changes
    # 省くのは changes が「ドキュメントだけ」と明示したときだけ。changes が失敗・中断して出力が無いときも流す
    # (needs の失敗で省かれると、必須のチェックが成功の扱いになりテストなしでマージできてしまう)
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # 本番の Cloud SQL(infra/gcp の sql_database_version = POSTGRES_17)とメジャーバージョンを合わせる
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # GAS版のサブモジュール(非公開)は取得しない: このジョブはリポジトリへの書き込みの権限が無い人のブランチ・依存の
      # コードも動かし、PR のワークフロー自体も PR で書き換えられるため、トークンを渡さない。gasParity は parity ジョブが
      # main への push で流す(手元では submodule update --init のあと pnpm test)
      - name: GAS版との一致テストについて
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "::notice title=GAS版との一致テスト(gasParity)::PR ではスキップします(サブモジュールのトークンを PR に渡さないため)。main へのマージ後に parity ジョブが流します。手元では submodule update --init のあと pnpm test で確かめてください。"

      - uses: ./.github/actions/setup

      - name: lint(biome)
        run: pnpm lint

      - name: 型検査
        run: pnpm typecheck

      - uses: ./.github/actions/test-db

      - name: スキーマとマイグレーションの差分チェック
        run: |
          pnpm db:generate
          # schema を変えたのに pnpm db:generate の結果(SQL・drizzle/meta)をコミットし忘れていると、ここで差分が出る
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --short -- packages/db/drizzle
            git diff -- packages/db/drizzle
            echo "::error title=マイグレーション未生成::packages/db/src/schema の変更に対応するマイグレーションがありません。pnpm db:generate の結果をコミットしてください。"
            exit 1
          fi

      # unit・web に加え、DATABASE_URL があるので integration(RLS・制約・並行性・API のルート)も動く
      - name: テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build

  # GAS版との一致テスト(gasParity: 勤怠の計算・ルートの検索・日報AIのプロンプトをGAS版のソース自体を node:vm で動かして比べる)。
  # GAS版(非公開リポジトリ)を読むトークン SUBMODULE_TOKEN は Environment legacy-submodule(ブランチは main だけ。doc/07 9.2)の
  # secret に置き、このジョブだけが受け取る。PR の実行(ref が refs/pull/…)は Environment の制限で受け取れないため、このジョブは
  # PR では動かさず、main への push と手で実行(main から)のときだけ流す。トークンが無い・取得できないときは警告を出して
  # 失敗にはしない(GAS版を取得できないテストはスキップされる)。
  parity:
    name: GAS版との一致テスト
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: legacy-submodule

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - id: legacy
        uses: ./.github/actions/legacy-submodule
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: ./.github/actions/setup

      - name: gasParity
        if: ${{ steps.legacy.outputs.available == 'true' }}
        run: pnpm vitest run --project unit gasParity

      - name: GAS版を取得できなかったため未実行
        if: ${{ steps.legacy.outputs.available != 'true' }}
        run: |
          echo "::warning title=gasParity 未実行::GAS版のソースを取得できなかったため一致テストを実行していません(SUBMODULE_TOKEN の設定・期限を確認: doc/07_インフラ・運用.md 9.2)。"

  e2e:
    name: 通し確認(e2e)
    needs: check
    # check が流れて成功したときだけ(省く条件は check の1か所に置く)
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 実際のAPI・DBにつないだ新アプリを操作し、1手順でも失敗すれば終了コード1で終わる(失敗の一覧・画面は下の artifact)。

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      API_PORT: '8080'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # playwright-core の版に対応する Chromium を入れる(版は tools/e2e/package.json で固定)
      - id: playwright
        name: Playwright の版
        run: echo "version=$(node -p "require('./tools/e2e/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium のインストール
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @katahimo/e2e exec playwright-core install --with-deps chromium

      - name: Chromium の依存ライブラリ
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @katahimo/e2e exec playwright-core install-deps chromium

      # Google Fonts のキャッシュ(src/fontCache.ts)。手順によって取得するサブセットが増えるため、
      # 毎回新しいキーで保存し、直近のものから復元する
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tools/e2e/.cache/fonts
          key: e2e-fonts-${{ github.run_id }}
          restore-keys: e2e-fonts-

      - uses: ./.github/actions/test-db

      - name: 開発用データの投入
        run: pnpm db:seed

      - name: API の起動(ビルドした Web 画面を同じオリジンで配信)
        run: |
          pnpm --filter @katahimo/web build
          WEB_DIST_DIR="$GITHUB_WORKSPACE/packages/web/dist" PORT="$API_PORT" \
            nohup pnpm --filter @katahimo/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --silent --fail --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null \
            "http://127.0.0.1:${API_PORT}/api/health/db"

      - name: 通し確認(e2e)
        env:
          KATAHIMO_WEB_URL: http://127.0.0.1:${{ env.API_PORT }}
        run: pnpm --filter @katahimo/e2e e2e

      - name: サーバーのログ
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/api.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-out
          path: tools/e2e/out
          if-no-files-found: ignore
          retention-days: 14
