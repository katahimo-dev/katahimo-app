name: セットアップ(pnpm・Node・依存)
description: package.json の packageManager の pnpm と Node 22 を入れ、pnpm install --frozen-lockfile まで行う

runs:
  using: composite
  steps:
    # version を指定しないと package.json の packageManager(pnpm@x.y.z)を使う
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm

    - name: 依存のインストール
      shell: bash
      run: pnpm install --frozen-lockfile
