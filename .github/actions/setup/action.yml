name: セットアップ(pnpm・Node・依存)
description: package.json の packageManager の pnpm と Node 22 を入れ、pnpm install --frozen-lockfile まで行う

runs:
  using: composite
  steps:
    # version を指定しないと package.json の packageManager(pnpm@x.y.z)を使う
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22
        cache: pnpm

    - name: 依存のインストール
      shell: bash
      run: pnpm install --frozen-lockfile
