# ローカル開発用 PostgreSQL。
# 開発マシンに PostgreSQL が直接インストール済みの場合はこれを使わず、infra/initdb の SQL を psql で流すだけでよい
# (doc/08_開発ガイド.md 1.1)。初回の起動で infra/initdb/docker-init.sh がロール(katahimo_owner / katahimo_migrator /
# katahimo_app / katahimo_worker / katahimo_readonly)と katahimo_dev を作る。
# PostgreSQL のメジャーバージョンは本番の Cloud SQL(infra/gcp の sql_database_version = POSTGRES_17)と
# CI(.github/workflows/ci.yml)に合わせる。上げるときは3か所を揃える。
services:
  db:
    image: postgres:17-alpine
    container_name: katahimo-db
    environment:
      # スーパーユーザー(初期化 SQL を流すためだけに使う。アプリは katahimo_app・katahimo_worker で接続する)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Tokyo
    ports:
      # 開発マシンの外(LAN)に公開しない。スーパーユーザーのパスワードが postgres の使い捨て DB のため
      - '127.0.0.1:5433:5432'
    volumes:
      # メジャーバージョンごとにデータの形式が違うため、ボリューム名に版を入れる(版・ロールの構成を変えたら作り直し)
      - katahimo-pgdata-17-v2:/var/lib/postgresql/data
      - ./initdb:/katahimo-initdb:ro
      - ./initdb/docker-init.sh:/docker-entrypoint-initdb.d/00_katahimo.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d katahimo_dev']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  katahimo-pgdata-17-v2:
