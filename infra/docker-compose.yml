# ローカル開発用 PostgreSQL。
# 開発マシンに PostgreSQL が直接インストール済みの場合はこれを使わず、
# infra/initdb/01_bootstrap.sql を psql で流すだけでよい(README参照)。
# PostgreSQL のメジャーバージョンは本番の Cloud SQL(infra/gcp の sql_database_version = POSTGRES_17)と
# CI(.github/workflows/ci.yml)に合わせる。上げるときは3か所を揃える。
services:
  db:
    image: postgres:17-alpine
    container_name: katahimo-db
    environment:
      POSTGRES_USER: katahimo
      POSTGRES_PASSWORD: katahimo
      POSTGRES_DB: katahimo_dev
      TZ: Asia/Tokyo
    ports:
      - '5433:5432'
    volumes:
      # メジャーバージョンごとにデータの形式が違うため、ボリューム名に版を入れる(版を変えたら作り直し)
      - katahimo-pgdata-17:/var/lib/postgresql/data
      - ./initdb/01_bootstrap.sql:/docker-entrypoint-initdb.d/01_bootstrap.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U katahimo -d katahimo_dev']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  katahimo-pgdata-17:
