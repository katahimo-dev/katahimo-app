# Cloud Build: イメージのビルド・push → マイグレーション(Cloud Run Job)→ デプロイ。
# 前提: infra/gcp(Terraform)を deploy_workloads=true で apply 済み。手順は doc/07_インフラ・運用.md 4章。
#
# 実行SAは katahimo-deployer(infra/gcp/iam.tf)。本番はタグ(vX.Y.Z)の push で動く GitHub トリガー katahimo-release
# (承認必須・_TRAFFIC=canary。doc/07 4.1)から動かす。最初のステップ verify-source が、このビルドが承認済みで、読む先がトリガーの
# リポジトリで、タグがビルドするコミットを指し、そのコミットが main に含まれることを GitHub に確かめてから先に進む
# (scripts/verifyReleaseSource.sh)。
# 手元から実行する場合(運用担当者だけ。確かめようがないため _ALLOW_UNVERIFIED_SOURCE=true を明示する)は:
#   gcloud builds submit --region=asia-northeast1 --config=cloudbuild.yaml \
#     --gcs-source-staging-dir="gs://${PROJECT_ID}-katahimo-build/source" \
#     --service-account="projects/${PROJECT_ID}/serviceAccounts/katahimo-deployer@${PROJECT_ID}.iam.gserviceaccount.com" \
#     --substitutions=_TAG="$(git rev-parse --short HEAD)",_TRAFFIC=canary,_ALLOW_UNVERIFIED_SOURCE=true
#
# verify-source の限界: このファイルはビルドするコミットの中にあるため、そのコミットを書ける人は確認を外せる。止められるのは
# 誤って・見直されずに付いたタグまでで、本番の守りは GitHub のタグのルールセット(タグを作れる人を絞る)と、トリガーの承認
# (承認する人がタグとマイグレーションの差分を見る)。doc/07 4.1・doc/06 12章。
#
# _TRAFFIC=canary では API の新しいリビジョンを利用者に向けずに(タグ canary の URL だけで)出し、ジョブのイメージは
# 変えない。確かめたら cloudbuild.promote.yaml で利用者を切り替え、ジョブを同じイメージにする。
#
# マイグレーションは新しいイメージのデプロイ前に流す(canary でも本番の DB に当たる)。そのため、マイグレーションは
# 旧バージョンのアプリでも動く形(列の追加→アプリ更新→旧列の削除は次のリリース、の2段階)で書くこと。

substitutions:
  _REGION: asia-northeast1
  _REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/katahimo
  # イメージのタグ。トリガー実行ではコミットの短いSHA、手元からは --substitutions=_TAG=... で指定する
  _TAG: ${SHORT_SHA}
  # false ならビルドと push だけ行う(マイグレーション・デプロイをしない)
  _DEPLOY: 'true'
  # latest: API をすぐ利用者に向け、ジョブも差し替える。canary: API は利用者に向けずタグ canary の URL だけで出し、
  # ジョブは変えない(cloudbuild.promote.yaml で切り替える)。本番のタグのトリガーは canary にする
  _TRAFFIC: latest
  # 手元からの gcloud builds submit(トリガーではない)で verify-source を通すときだけ true にする。トリガーからのビルドでは
  # 無視する(トリガーの置換で確認を外せないように)
  _ALLOW_UNVERIFIED_SOURCE: 'false'
  # verify-source が読む GitHub のリポジトリと、読むためのトークンを出す Cloud Build の第 2 世代の接続のリポジトリ
  # (doc/07 4.1 の接続 github1。katahimo-deployer に roles/cloudbuild.readTokenAccessor が要る)。トリガーからのビルドでは
  # _SOURCE_GIT_URL がトリガーのリポジトリ(REPO_FULL_NAME)でなければ verify-source が止まる(置換で別のリポジトリに向けられない)
  _SOURCE_GIT_URL: https://github.com/katahimo-dev/katahimo-app.git
  _SOURCE_REPOSITORY: projects/${PROJECT_ID}/locations/${_REGION}/connections/github1/repositories/katahimo-dev-katahimo-app

options:
  # 既定以外のサービスアカウントで動かすビルドはログの出力先の指定が必須
  logging: CLOUD_LOGGING_ONLY
  # _REGISTRY の中で _REGION / PROJECT_ID を展開する
  dynamicSubstitutions: true
  # 使うステージだけをビルドする(マルチステージの --target)
  env:
    - DOCKER_BUILDKIT=1

steps:
  # ビルド・push・マイグレーションの前に、出すソースが main のリリースのタグか確かめる(失敗したら何もしない)。
  # ワークスペースの .git(トリガーの種類で有無・浅さが変わる)は使わず、GitHub から直接読む。
  - id: verify-source
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: [scripts/verifyReleaseSource.sh]
    env:
      - TRIGGER_NAME=${TRIGGER_NAME}
      - TAG_NAME=${TAG_NAME}
      - COMMIT_SHA=${COMMIT_SHA}
      # このビルドの承認の状態を読む(gcloud builds describe)。REPO_FULL_NAME はトリガーのリポジトリ(組み込みの置換で、
      # 置換では変えられない)で、_SOURCE_GIT_URL がこのリポジトリを指しているかを確かめる
      - BUILD_ID=${BUILD_ID}
      - REGION=${_REGION}
      - REPO_FULL_NAME=${REPO_FULL_NAME}
      - ALLOW_UNVERIFIED_SOURCE=${_ALLOW_UNVERIFIED_SOURCE}
      - SOURCE_GIT_URL=${_SOURCE_GIT_URL}
      - SOURCE_REPOSITORY=${_SOURCE_REPOSITORY}
    waitFor: ['-']

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=api
      - --tag=${_REGISTRY}/api:${_TAG}
      - --tag=${_REGISTRY}/api:latest
      - .
    waitFor: [verify-source]

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=worker
      - --tag=${_REGISTRY}/worker:${_TAG}
      - --tag=${_REGISTRY}/worker:latest
      - .
    waitFor: [verify-source]

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/api
    waitFor: [build-api]

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/worker
    waitFor: [build-worker]

  # マイグレーション(失敗したらここで止まり、デプロイしない)。_DEPLOY=false ならイメージの push だけで終える
  # (初回、Terraform で Cloud Run を作る前にイメージを用意するとき。doc/07_インフラ・運用.md 3.5)。
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        [ "${_DEPLOY}" = true ] || { echo "_DEPLOY=${_DEPLOY}: デプロイしません"; exit 0; }
        gcloud run jobs update katahimo-migrate --region=${_REGION} --image=${_REGISTRY}/worker:${_TAG}
        gcloud run jobs execute katahimo-migrate --region=${_REGION} --wait
    waitFor: [push-worker]

  # 既存のサービス・ジョブのイメージだけを差し替える(services update は存在しないサービスを作らない。
  # 設定は Terraform が管理する)
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        [ "${_DEPLOY}" = true ] || exit 0
        case "${_TRAFFIC}" in
          latest)
            gcloud run services update katahimo-api --region=${_REGION} --image=${_REGISTRY}/api:${_TAG}
            ;;
          canary)
            # 利用者は今のリビジョンのまま。タグ canary を新しいリビジョンに付け直す
            gcloud run services update katahimo-api --region=${_REGION} --image=${_REGISTRY}/api:${_TAG} \
              --no-traffic --tag=canary
            echo "確かめる URL:"
            gcloud run services describe katahimo-api --region=${_REGION} \
              --format='value(status.traffic[].url)' | tr ';' '\n' | grep 'canary---' || true
            echo "確かめたら cloudbuild.promote.yaml を _TAG=${_TAG} で実行する(doc/07 4章)"
            ;;
          *)
            echo "_TRAFFIC は latest か canary: ${_TRAFFIC}" >&2
            exit 1
            ;;
        esac
    waitFor: [push-api, migrate]

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        [ "${_DEPLOY}" = true ] || exit 0
        # canary ではジョブを変えない(利用者に向けていない版で夜間ジョブ・outbox を処理しないため)
        [ "${_TRAFFIC}" = latest ] || { echo "_TRAFFIC=${_TRAFFIC}: ジョブは cloudbuild.promote.yaml で差し替えます"; exit 0; }
        for job in outbox-drain route-notice nightly-calendar-sync csv-import maintenance sync-busy-blocks; do
          gcloud run jobs update "katahimo-$${job}" --region=${_REGION} --image=${_REGISTRY}/worker:${_TAG}
        done
        # 運用スクリプトのジョブ(api のイメージ。dist/ops/*。infra/gcp/run.tf)。Terraform で作る前の環境では飛ばす
        if gcloud run jobs list --region=${_REGION} --filter='metadata.name=katahimo-ops' --format='value(metadata.name)' | grep -q .; then
          gcloud run jobs update katahimo-ops --region=${_REGION} --image=${_REGISTRY}/api:${_TAG}
        fi
        # 公開デモの作り直し(infra/gcp の demo_mode のときだけある。api のイメージ)
        if gcloud run jobs list --region=${_REGION} --filter='metadata.name=katahimo-demo-reset' --format='value(metadata.name)' | grep -q .; then
          gcloud run jobs update katahimo-demo-reset --region=${_REGION} --image=${_REGISTRY}/api:${_TAG}
        fi
    waitFor: [push-api, migrate]
